<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <style>
      body { margin: 0; display: flex; height: 100vh; }
      #conversations { width: 15rem; flex: none; overflow-y: auto; padding: 0.75rem; border-right: 1px solid #ddd; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; gap: 0.25rem; }
      #conversations a { color: inherit; text-decoration: none; padding: 0.25rem 0.5rem; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #conversations a[aria-current="page"] { background: #eef; }
      #conversations form { margin-top: auto; }
      #app { flex: 1; min-width: 0; position: relative; }
    </style>
  </head>

    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
