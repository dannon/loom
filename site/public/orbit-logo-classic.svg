<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 340" width="1560" height="340">
  <defs>
    <linearGradient id="gfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d0bd2a"/>
      <stop offset="1" stop-color="#d0bd2a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="planet">
      <circle cx="170" cy="170" r="86"/>
    </clipPath>
  </defs>

  <!-- ===== icon: the Galaxy, in orbit ===== -->
  <!-- back half of the orbit ring (passes behind planet) -->
  <g transform="rotate(-18 170 170)">
    <path d="M 15,170 A 155,52 0 0 1 325,170" fill="none" stroke="#58585a" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- planet: circle with the three-bar galaxy mark -->
  <g clip-path="url(#planet)">
    <circle cx="170" cy="170" r="86" fill="#ffffff"/>
    <rect x="104" y="112" width="100" height="30" rx="9" fill="#58585a"/>
    <rect x="104" y="152" width="62" height="30" rx="9" fill="#58585a"/>
    <rect x="134" y="192" width="100" height="30" rx="9" fill="url(#gfade)"/>
  </g>
  <circle cx="170" cy="170" r="86" fill="none" stroke="#58585a" stroke-width="14"/>
  <!-- front half of the orbit ring -->
  <g transform="rotate(-18 170 170)">
    <path d="M 15,170 A 155,52 0 0 0 325,170" fill="none" stroke="#58585a" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- satellite on the front arc -->
  <circle cx="50" cy="236" r="17" fill="#d0bd2a"/>

  <!-- ===== wordmark: ORBIT, thin rounded geometric strokes ===== -->
  <g fill="none" stroke="#58585a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- O -->
    <ellipse cx="500" cy="170" rx="82" ry="100"/>
    <!-- R -->
    <path d="M 660,270 V 70"/>
    <path d="M 660,70 h 66 a 52,52 0 0 1 0,104 h -66"/>
    <path d="M 700,174 L 782,270"/>
    <!-- B -->
    <path d="M 860,270 V 70"/>
    <path d="M 860,70 h 58 a 50,50 0 0 1 0,100 h -58"/>
    <path d="M 860,170 h 68 a 50,50 0 0 1 0,100 h -68"/>
    <!-- I -->
    <path d="M 1058,70 V 270"/>
    <!-- T -->
    <path d="M 1160,70 h 180"/>
    <path d="M 1250,70 V 270"/>
  </g>
</svg>
